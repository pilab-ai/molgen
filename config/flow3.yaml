data:
  # Can be either:
  # - a first-stage Lightning checkpoint containing codes.weight
  # - a .pt file containing a [N, D] tensor or dict key z/z_norm/latents/codes
  latent_path:
  latent_key: auto
  normalize: true
  val_ratio: 0.1

latent_transform:
  type: pca_whiten
  dim: 256
  eps: 0.00001
  sample_residual: true

model:
  code_dim: 256
  hidden_dim: 768
  n_layers: 4
  time_dim: 128
  dropout: 0.08

optim:
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: onecycle
  onecycle_pct_start: 0.05
  onecycle_final_div_factor: 20.0

loss:
  ot_coupling: false
  fixed_noise: false
  time_weighting: none
  cosine_loss_weight: 0.0
  norm_loss_weight: 0.0
  t_eps: 0.001

trainer:
  seed: 42
  batch_size: 64
  num_workers: 0
  pin_memory: false
  max_epochs: 300
  accelerator: gpu
  devices: 4
  strategy: ddp
  precision: bf16-mixed
  log_dir: logs/flow
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 30
    min_delta: 0.002
  fast_dev_run: false

sample:
  steps: 100
  solver: heun
  save_after_fit: true
  n_samples: 512
  output_path: logs/flow/samples_pca.pt
  evaluate_after_fit: true
  summary_path: logs/flow/sample_summary_pca.json
  eval_bank_size: 8192
  eval_query_size: 512
